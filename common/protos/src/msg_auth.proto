syntax = "proto3";

package game;
option go_package = "./pb";


// 到游戏服的验证
message Req_AuthClientToGame {
  int64 playerID = 1;  // 角色id
  int32 serverID = 2;
  string gatewayAddr = 3; //
}

message Rsp_AuthClientToGame {
  bool result = 1;  // 结果
}

// 到房间服的验证
message Req_AuthClientToRoom {
  int64 playerID = 1;  // 角色id
  int32 serverID = 2;
  string roomId = 3; //
}

message Rsp_AuthClientToRoom {
  bool result = 1;  // 结果
}

message Req_AuthClientToGateWay{
  int64 uerID = 1;
  int64 playerID = 2;
  int32 serverID = 3;
  string token = 4;
}

message Req_HeartBeat {
}

message Notify_Kick {
  string Reason = 1;
}